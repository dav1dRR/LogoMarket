<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu carrito - LogoMarket</title>
    <link rel="stylesheet" href="CarritoStyle.css" />
</head>
<body>
    <header class="cart-header">
        <div class="container cart-header-inner">
            <a href="../catalogo1.html" class="back-link">
                <ion-icon name="arrow-back-outline"></ion-icon>
                Seguir comprando
            </a>
            <div class="mini-logo">
                <img src="../Imagenes/LogoMarketLogo.png" alt="">
                <span>LogoMarket</span>
            </div>
        </div>
    </header>

    <main class="cart-main container">
        <h1 class="heading-1">Tu carrito</h1>

        <div class="cart-layout">
            <!-- Columna izquierda: productos -->
            <section class="cart-items" id="cart-items">
                <!-- JS inyecta aquí los productos o el estado vacío -->
            </section>

            <!-- Columna derecha: resumen y pago -->
            <aside class="cart-summary">
                <h2>Resumen del pedido</h2>
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="subtotal">$0.00</span>
                </div>
                <div class="summary-row">
                    <span>Envío</span>
                    <span class="free-shipping">Gratis</span>
                </div>
                <div class="summary-row total">
                    <span>Total</span>
                    <span id="total">$0.00</span>
                </div>

                <h2>Método de pago</h2>
                <div class="payment-methods" id="payment-methods">
                    <label class="payment-option" data-method="pse">
                        <input type="radio" name="payment" value="pse" checked>
                        <span class="payment-icon"><ion-icon name="business-outline"></ion-icon></span>
                        <span class="payment-label">PSE</span>
                    </label>
                    <label class="payment-option" data-method="nequi">
                        <input type="radio" name="payment" value="nequi">
                        <span class="payment-icon"><ion-icon name="phone-portrait-outline"></ion-icon></span>
                        <span class="payment-label">Nequi</span>
                    </label>
                    <label class="payment-option" data-method="breb">
                        <input type="radio" name="payment" value="breb">
                        <span class="payment-icon"><ion-icon name="flash-outline"></ion-icon></span>
                        <span class="payment-label">Bre-B</span>
                    </label>
                    <label class="payment-option" data-method="card">
                        <input type="radio" name="payment" value="card">
                        <span class="payment-icon"><ion-icon name="card-outline"></ion-icon></span>
                        <span class="payment-label">Tarjeta</span>
                    </label>
                </div>

                <div class="payment-details" id="payment-details">
                    
                </div>

                <button class="btn-checkout" id="btn-checkout">
                    Pagar ahora <span id="btn-total">$0.00</span>
                </button>
                <p class="secure-note">
                    <ion-icon name="lock-closed-outline"></ion-icon>
                    Pago 100% seguro y encriptado
                </p>
            </aside>
        </div>
    </main>

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script>
        const CART_KEY = 'logomarket_cart';

        function getCart() {
            try {
                return JSON.parse(localStorage.getItem(CART_KEY)) || [];
            } catch {
                return [];
            }
        }

        function saveCart(cart) {
            localStorage.setItem(CART_KEY, JSON.stringify(cart));
        }

        function formatPrice(value) {
            return `$${value.toFixed(2)}`;
        }

        function renderCart() {
            const cart = getCart();
            const itemsContainer = document.getElementById('cart-items');

            if (cart.length === 0) {
                itemsContainer.innerHTML = `
                    <div class="cart-empty">
                        <ion-icon name="cart-outline"></ion-icon>
                        <p>Tu carrito está vacío</p>
                        <a href="../catalogo1.html" class="btn-empty">Ver catálogo</a>
                    </div>
                `;
            } else {
                itemsContainer.innerHTML = cart.map((item, index) => `
                    <article class="cart-item">
                        <img src="../${item.image}" alt="${item.name}">
                        <div class="cart-item-info">
                            <h3>${item.name}</h3>
                            <p class="cart-item-unit">${formatPrice(item.price)} c/u</p>
                            <div class="qty-control">
                                <button class="qty-btn" data-action="decrease" data-index="${index}">−</button>
                                <span>${item.qty}</span>
                                <button class="qty-btn" data-action="increase" data-index="${index}">+</button>
                            </div>
                        </div>
                        <div class="cart-item-side">
                            <p class="cart-item-total">${formatPrice(item.price * item.qty)}</p>
                            <button class="remove-btn" data-index="${index}">
                                <ion-icon name="trash-outline"></ion-icon>
                            </button>
                        </div>
                    </article>
                `).join('');
            }

            updateTotals(cart);
            bindItemEvents();
        }

        function updateTotals(cart) {
            const subtotal = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
            document.getElementById('subtotal').textContent = formatPrice(subtotal);
            document.getElementById('total').textContent = formatPrice(subtotal);
            document.getElementById('btn-total').textContent = formatPrice(subtotal);

            const checkoutBtn = document.getElementById('btn-checkout');
            checkoutBtn.disabled = cart.length === 0;
        }

        function bindItemEvents() {
            document.querySelectorAll('.qty-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const cart = getCart();
                    const index = Number(btn.dataset.index);
                    if (btn.dataset.action === 'increase') {
                        cart[index].qty += 1;
                    } else if (cart[index].qty > 1) {
                        cart[index].qty -= 1;
                    } else {
                        cart.splice(index, 1);
                    }
                    saveCart(cart);
                    renderCart();
                });
            });

            document.querySelectorAll('.remove-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const cart = getCart();
                    cart.splice(Number(btn.dataset.index), 1);
                    saveCart(cart);
                    renderCart();
                });
            });
        }

        const paymentForms = {
            pse: `
                <div class="form-group">
                    <label>Banco</label>
                    <select>
                        <option>Bancolombia</option>
                        <option>Davivienda</option>
                        <option>BBVA</option>
                        <option>Banco de Bogotá</option>
                        <option>Nu Colombia</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Tipo de documento</label>
                    <select>
                        <option>Cédula de ciudadanía</option>
                        <option>Cédula de extranjería</option>
                        <option>NIT</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Número de documento</label>
                    <input type="text" placeholder="1 000 000 000">
                </div>
            `,
            nequi: `
                <div class="form-group">
                    <label>Número de celular Nequi</label>
                    <input type="tel" placeholder="300 000 0000">
                </div>
                <p class="payment-hint">Vas a recibir una notificación en tu app Nequi para aprobar el pago.</p>
            `,
            breb: `
                <div class="form-group">
                    <label>Llave Bre-B</label>
                    <input type="text" placeholder="Celular, correo o llave alfanumérica">
                </div>
                <p class="payment-hint">Confirma el pago desde tu app bancaria compatible con Bre-B.</p>
            `,
            card: `
                <div class="card-brands">
                    <span class="brand-chip">VISA</span>
                    <span class="brand-chip">Mastercard</span>
                </div>
                <div class="form-group">
                    <label>Número de tarjeta</label>
                    <input type="text" placeholder="0000 0000 0000 0000">
                </div>
                <div class="form-group">
                    <label>Nombre del titular</label>
                    <input type="text" placeholder="Como aparece en la tarjeta">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Vencimiento</label>
                        <input type="text" placeholder="MM/AA">
                    </div>
                    <div class="form-group">
                        <label>CVV</label>
                        <input type="text" placeholder="123">
                    </div>
                </div>
            `
        };

        function renderPaymentDetails(method) {
            document.getElementById('payment-details').innerHTML = paymentForms[method] || '';
        }

        function bindPaymentEvents() {
            document.querySelectorAll('input[name="payment"]').forEach(input => {
                input.addEventListener('change', (e) => {
                    document.querySelectorAll('.payment-option').forEach(opt => opt.classList.remove('selected'));
                    e.target.closest('.payment-option').classList.add('selected');
                    renderPaymentDetails(e.target.value);
                });
            });
        }

        document.getElementById('btn-checkout').addEventListener('click', () => {
            const cart = getCart();
            if (cart.length === 0) return;

            const method = document.querySelector('input[name="payment"]:checked').value;
            const names = { pse: 'PSE', nequi: 'Nequi', breb: 'Bre-B', card: 'tarjeta' };

            alert(`Pedido confirmado. Vas a pagar ${document.getElementById('total').textContent} con ${names[method]}.`);
            localStorage.removeItem(CART_KEY);
            renderCart();
        });

        document.addEventListener('DOMContentLoaded', () => {
            renderCart();
            bindPaymentEvents();
            document.querySelector('.payment-option[data-method="pse"]').classList.add('selected');
            renderPaymentDetails('pse');
        });
    </script>
</body>
</html>
